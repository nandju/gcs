<!-- Modèle EmailJS « Contact GCS » — à coller dans le Code Editor
     du dashboard EmailJS. Charte GCS : navy #0a1e30, corail #e8552d. -->
<div style="margin:0;padding:24px 12px;background:#f5f7fa;font-family:'Segoe UI',Arial,sans-serif;color:#14263a;">
  <div style="max-width:640px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e3e9f0;">

    <div style="background:#0a1e30;padding:24px 28px;">
      <p style="margin:0;font-size:20px;font-weight:800;color:#ffffff;">GCS</p>
      <p style="margin:6px 0 0;font-size:15px;color:#f6a88f;font-weight:600;">Nouveau message de contact</p>
      <p style="margin:6px 0 0;font-size:12px;color:#9fb3c4;">{{submission_date}}</p>
    </div>

    <div style="padding:20px 28px 8px;">
      <table style="width:100%;border-collapse:collapse;font-size:14px;">
        <tr><td style="padding:5px 12px 5px 0;color:#5c6f80;white-space:nowrap;vertical-align:top;">Nom</td><td style="padding:5px 0;">{{contact_name}}</td></tr>
        <tr><td style="padding:5px 12px 5px 0;color:#5c6f80;white-space:nowrap;vertical-align:top;">E-mail</td><td style="padding:5px 0;">{{contact_email}}</td></tr>
        <tr><td style="padding:5px 12px 5px 0;color:#5c6f80;white-space:nowrap;vertical-align:top;">Sujet</td><td style="padding:5px 0;">{{contact_subject}}</td></tr>
      </table>
      <div style="margin-top:14px;background:#f5f7fa;border:1px solid #e3e9f0;border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.7;white-space:pre-line;">{{contact_message}}</div>
    </div>

    <div style="padding:18px 28px 26px;color:#5c6f80;font-size:12px;">
      Message envoyé depuis la page contact du site GCS.
      Répondez directement à cet e-mail pour contacter le visiteur.
    </div>
  </div>
</div>
